spring.application.name=todo-service
server.port=1002
# The public half of auth-service's signing key. Fetched once and cached; only the public half ever travels.
auth.jwks-uri=http://localhost:1001/api/jwks.json
# Which users have had their tokens revoked. Polled, at most every 10s, so a suspension bites here too.
auth.token-versions-uri=http://localhost:1001/internal/token-versions

# One database per service, so neither can read the other's tables even by accident.
# Compose overrides all three with SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:1006/todo
spring.datasource.username=todo
spring.datasource.password=todo
# The schema is Liquibase's, from db/changelog; Hibernate only checks that the entities match it. A database that
# the ddl-auto=update of earlier versions built has the first changeset marked ran, not run.
spring.jpa.hibernate.ddl-auto=validate
