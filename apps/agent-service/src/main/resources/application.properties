spring.application.name=agent-service
server.port=9083
# /actuator/health, for the compose healthcheck, and nothing else: no details, no other endpoints.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# The public half of auth-service's signing key. Fetched once and cached; only the public half ever travels.
auth.jwks-uri=http://localhost:9081/api/jwks.json
# Which users have had their tokens revoked. Polled, at most every 10s, so a suspension bites here too.
auth.token-versions-uri=http://localhost:9081/internal/token-versions
# Where the long-lived token an external agent connects with is minted (POST /api/agents/{id}/token asks for it).
auth.agent-tokens-uri=http://localhost:9081/internal/agent-tokens
# Sent along as X-Internal-Secret; must match auth-service's auth.internal-secret. AUTH_INTERNAL_SECRET in .env sets both.
auth.internal-secret=dev-internal-secret
# Encrypts the authorization header stored on a server row, AES-256-GCM. A development value, like the secret above;
# AGENTS_AUTH_HEADER_KEY in .env overrides it. Blank refuses to start.
agents.auth-header-key=dev-auth-header-key

# One database per service, so none can read another's tables even by accident.
# SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD override all three.
spring.datasource.url=jdbc:postgresql://localhost:5432/agent
spring.datasource.username=agent
spring.datasource.password=agent
# The schema is Liquibase's, from db/changelog; Hibernate only checks that the entities match it. A database that
# already has the tables (ddl-auto=update or Flyway built it) has the first changeset marked ran, not run.
spring.jpa.hibernate.ddl-auto=validate
# Every read happens inside a service method; nothing needs a session held open for the whole request.
spring.jpa.open-in-view=false
# Columns in declaration order. The default sorts small columns ahead of the id, and the SQLite dialect the
# tests run on then writes the id with no type, so it is never assigned. Postgres does not care either way.
spring.jpa.properties.hibernate.column_ordering_strategy=legacy

# The deployment's own MCP servers, comma separated, trusted exactly as written. Any URL an owner types that is
# not on this list must resolve to a public address: nothing loopback, private, link-local, CGNAT or multicast,
# and no bare compose service name, or this service would POST into its own network on the owner's say-so.
# Default: todo-service's MCP endpoint as run from source; compose sets its own.
agents.trusted-server-urls=http://localhost:9082/mcp
