# The whole stack: `docker compose up -d --build --wait`, then http://localhost:1000.
# Postgres alone, for running the services from the IDE: `docker compose up -d --wait db db-init` (with the port
# compose.override.yaml publishes). Settings come from .env (see .env.example); anything unset keeps the
# service's development default, so the stack starts with no .env at all -- fine on a laptop, wrong anywhere else.
# Only web and mailpit publish a port, both on loopback; the services and the database talk over the compose network.
# Ports: web 1000, auth-service 1001, todo-service 1002, agent-service 1003, Mailpit 1004 (its SMTP 1005), Postgres 1006
# (compose.override.yaml). Each container is <project>-<service>, demo-base-auth-service and so on, with no -1:
# COMPOSE_PROJECT_NAME renames the lot. The name is fixed, so every checkout drives the same stack and database
# volume; a second stack side by side needs its own COMPOSE_PROJECT_NAME and other host ports.
name: demo-base

services:
  db:
    container_name: ${COMPOSE_PROJECT_NAME:-demo-base}-db
    image: postgres:18-alpine
    # Postgres' own floor is shared_buffers (128MB by default) plus a little per connection; the three
    # services open one small Hikari pool each.
    mem_limit: 192m
    cpus: 0.5
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      # Postgres 18+ puts the cluster in a major-version subdirectory, so the mount goes one
      # level up at /var/lib/postgresql. The pre-18 path (.../data) is refused outright.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Creates whatever role and database is missing, then exits. It runs on every `up`, not only when the
  # volume is new, so a service added later gets its database on the volume that already exists.
  db-init:
    container_name: ${COMPOSE_PROJECT_NAME:-demo-base}-db-init
    image: postgres:18-alpine
    mem_limit: 32m
    cpus: 0.5
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./docker/initdb.sql:/initdb.sql:ro
    command: ["psql", "-h", "db", "-U", "postgres", "-v", "ON_ERROR_STOP=1", "-f", "/initdb.sql"]
    depends_on:
      db:
        condition: service_healthy

  auth-service:
    container_name: ${COMPOSE_PROJECT_NAME:-demo-base}-auth-service
    build:
      context: .
      target: auth-service
    # Measured, not guessed: see the resources section of the README for how to re-measure. The JVM reads
    # the cgroup limit, so mem_limit is what sizes the heap -- at 50% of 352m that is a 176m heap, leaving
    # the rest for metaspace, code cache, thread stacks and the GC itself.
    mem_limit: 352m
    cpus: 1.0
    # .env's names are the services' own environment bindings (ADMIN_EMAIL, OAUTH_GOOGLE_*, ...), so it is
    # handed over whole rather than repeated here.
    env_file: [{ path: .env, required: false }]
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/auth
      # Mailpit unless .env names a real server.
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
    depends_on:
      db-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:1001/api/public/stats || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Catches every mail auth-service sends (the links that prove an address): http://localhost:1004.
  mailpit:
    container_name: ${COMPOSE_PROJECT_NAME:-demo-base}-mailpit
    image: axllent/mailpit:v1.28
    mem_limit: 64m
    cpus: 0.5
    ports:
      - "127.0.0.1:1004:8025"   # the inbox
      - "127.0.0.1:1005:1025"   # SMTP, for auth-service run from source

  todo-service:
    container_name: ${COMPOSE_PROJECT_NAME:-demo-base}-todo-service
    build:
      context: .
      target: todo-service
    # Same JVM arithmetic as auth-service.
    mem_limit: 352m
    cpus: 1.0
    env_file: [{ path: .env, required: false }]
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/todo
      # .env reaches every service; auth-service's own secrets stay with it. Either key forges a way into any user.
      AUTH_SIGNING_KEY: ""
      AUTH_EMAIL_LINK_KEY: ""
      ADMIN_PASSWORD: ""
      # Only the public half of the signing key ever crosses this network.
      AUTH_JWKS_URI: http://auth-service:1001/api/jwks.json
      AUTH_TOKEN_VERSIONS_URI: http://auth-service:1001/internal/token-versions
    depends_on:
      db-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:1002/api/public/todos/stats || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  agent-service:
    container_name: ${COMPOSE_PROJECT_NAME:-demo-base}-agent-service
    build:
      context: .
      target: agent-service
    # Same JVM arithmetic as the other two; this one also carries the MCP server and client.
    mem_limit: 384m
    cpus: 1.0
    env_file: [{ path: .env, required: false }]
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/agent
      AUTH_SIGNING_KEY: ""
      AUTH_EMAIL_LINK_KEY: ""
      ADMIN_PASSWORD: ""
      AUTH_JWKS_URI: http://auth-service:1001/api/jwks.json
      AUTH_TOKEN_VERSIONS_URI: http://auth-service:1001/internal/token-versions
      AUTH_AGENT_TOKENS_URI: http://auth-service:1001/internal/agent-tokens
      # The deployment's own MCP servers an owner may attach by their private name. .env may override.
      AGENTS_TRUSTED_SERVER_URLS: ${AGENTS_TRUSTED_SERVER_URLS:-http://todo-service:1002/mcp}
    depends_on:
      db-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      todo-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:1003/actuator/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The Angular app on nginx, routing /api and /mcp to the services like the dev server (docker/nginx.conf).
  web:
    container_name: ${COMPOSE_PROJECT_NAME:-demo-base}-web
    build:
      context: .
      target: web
    mem_limit: 32m
    cpus: 0.5
    # Loopback, like Mailpit: the development defaults (admin, secrets) must not face the LAN.
    ports:
      - "127.0.0.1:1000:80"
    depends_on:
      auth-service:
        condition: service_healthy
      todo-service:
        condition: service_healthy
      agent-service:
        condition: service_healthy

volumes:
  db-data:
