# The web image: the Angular build plus the routes apps/web/proxy.conf.json gives the dev server.
# nginx picks the longest matching prefix, so the order below does not matter.
server {
  listen 80;
  root /usr/share/nginx/html;

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # The token lives in localStorage, so script injection is the risk that matters: scripts from this origin only.
  # Styles allow inline because Angular injects component styles as <style> tags; fonts come from Google
  # (index.html). The build turns off Angular's inline critical-CSS loader (angular.json), the one inline script.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  # ponytail: no HSTS, this listens on plain :80; add it where TLS terminates.

  location /api/agents        { proxy_pass http://agent-service:9083; }
  location /api/public/agents { proxy_pass http://agent-service:9083; }
  location /mcp               { proxy_pass http://agent-service:9083; }
  location /api/todos         { proxy_pass http://todo-service:9082; }
  location /api/public/todos  { proxy_pass http://todo-service:9082; }
  location /api               { proxy_pass http://auth-service:9081; }
  # Compose network only (the services call it directly); never through here, not even by accident.
  location /internal          { return 404; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
